name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # Tests need the light scientific stack only (no torch / sentence-transformers downloads).
        run: pip install -e ".[dev]" scipy scikit-learn statsmodels rank-bm25
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, synthetic fixtures only)
        run: pytest -q -m "not network"
