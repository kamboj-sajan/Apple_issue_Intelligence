name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # CPU-only torch keeps the install small (the default Linux wheel bundles CUDA).
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,test]" torch-geometric
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, synthetic fixtures only)
        run: pytest -q -m "not network"
