# Pipeline configuration. Paths are relative to the repository root unless absolute.
# Environment overrides: AII_DATA_DIR, STACKEXCHANGE_KEY.

data_dir: ./data

source:
  api_base: https://api.stackexchange.com/2.3
  site: apple
  # Custom filter created via /filters/create (see docs/data_policy.md). Includes body,
  # closed_details.original_questions, accepted_answer_id, last_edit_date; excludes user ids,
  # reputation and avatars. Only author display_name/link are kept, for CC BY-SA attribution.
  filter: "!B8mNJazdo)wiZFt*a7JZ_OJE0gc)-W"

ingestion:
  start: "2019-01-01"        # inclusive, UTC
  end: null                  # exclusive, UTC; null = now
  chunk: month               # creation-date chunk size for paginated collection
  page_size: 100             # API maximum
  min_interval_seconds: 0.5  # polite spacing between requests
  max_retries: 5
  quota_reserve: 10          # stop when this many requests remain in the daily quota
  timeout_seconds: 30

preprocessing:
  entities_config: configs/entities.yaml

splits:
  # Fractions of questions (by creation time). Boundaries are rounded down to a Monday 00:00 UTC.
  train_fraction: 0.70
  val_fraction: 0.15
  # Optional explicit boundaries (ISO dates); when set they override fractions.
  val_start: null
  test_start: null

time_window: W-MON  # pandas offset alias for weekly windows starting Monday

anomaly:
  detector:
    lookback_weeks: 26        # strictly past weeks used for the baseline
    min_history_weeks: 12     # weeks with site volume > 0 required inside the lookback
    min_expected: 2.0         # expected count below this => "insufficient data", not scored
  fdr_q: 0.05                 # Benjamini-Hochberg level across groups tested in the same week
  min_observed: 5
  min_rel_change: 0.5
  min_group_total: 20         # groups with fewer questions overall are not tested
  min_tagpair_support: 30
  rolling_z: 3.0
  cp_min_group_total: 100
  cp_min_size: 4
  cp_min_rel_increase: 0.25
  follow_up_weeks: 3

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
