# Local stack: PostgreSQL + pgvector, FastAPI backend, Next.js dashboard.
# Defaults are for local development only; override them in .env (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aii_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aii}
    ports:
      - "127.0.0.1:${AII_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aii} -d ${POSTGRES_DB:-aii}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aii}:${POSTGRES_PASSWORD:-aii_local_dev}@db:5432/${POSTGRES_DB:-aii}
      AII_DATA_DIR: /app/data
      STACKEXCHANGE_KEY: ${STACKEXCHANGE_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000  # both ways of opening the dashboard
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
