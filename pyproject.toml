[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-issue-intelligence"
version = "0.1.0"
description = "Temporal anomaly detection, knowledge graphs and GraphSAGE link prediction over public Ask Different questions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sajan Kamboj" }]
license = { text = "MIT (code only; Stack Exchange content is CC BY-SA)" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "sentence-transformers>=2.7",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "networkx>=3.2",
    "rank-bm25>=0.2.2",
    "mlflow>=2.12",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
# What the offline test suite imports (no torch / sentence-transformers downloads).
test = ["scipy>=1.11", "scikit-learn>=1.4", "statsmodels>=0.14", "rank-bm25>=0.2.2", "networkx>=3.2"]

[project.scripts]
aii = "ml.cli:main"

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
markers = [
    "network: test requires live network access (deselected by default in CI)",
    "slow: long-running test",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
